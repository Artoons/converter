name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xz-utils

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate application icons
        run: node scripts/generate-icon.mjs

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          includeRelease: false
          includeUpdaterJson: false

      - name: Stage normalized release artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null
          $nsis = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi  = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "dist-installers/ARTOONS-Converter-windows-x64-setup.exe" }
          if ($msi)  { Copy-Item $msi.FullName  "dist-installers/ARTOONS-Converter-windows-x64.msi" }

      # -----------------------------------------------------------------------
      # Free Open-Source Windows Code Signing via SignPath.io
      # Activated automatically once SIGNPATH_API_TOKEN is configured in repo secrets.
      # -----------------------------------------------------------------------
      - name: Submit Windows installers to SignPath.io
        if: matrix.os == 'windows-latest' && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'artoons-converter' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: unsigned-windows-installers
          wait-for-completion: true
          output-artifact-directory: dist-installers

      - name: Stage normalized release artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist-installers
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          cp "$DMG" dist-installers/ARTOONS-Converter-macos-universal.dmg

      - name: Stage normalized release artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p dist-installers
          APPIMAGE=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
          cp "$APPIMAGE" dist-installers/ARTOONS-Converter-linux-x86_64.AppImage
          chmod +x dist-installers/ARTOONS-Converter-linux-x86_64.AppImage

      - name: Upload matrix installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: dist-installers/*
          if-no-files-found: error

  publish-release:
    name: Checksums & GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums-sha256.txt
        working-directory: release-assets
        run: |
          sha256sum ARTOONS-Converter-* | tee checksums-sha256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/ARTOONS-Converter-*
            release-assets/checksums-sha256.txt
